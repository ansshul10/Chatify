<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;padding:0;font-family:Inter,-apple-system,sans-serif;background:#F5F5F5;color:#0A0A0A}
.container{max-width:560px;margin:40px auto;background:#FFFFFF;border:1px solid #E0E0E0}
.header{padding:32px;border-bottom:1px solid #E0E0E0;text-align:center}
.header h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-0.5px}
.content{padding:32px}
.content p{font-size:14px;line-height:1.6;margin:0 0 16px}
.footer{padding:24px 32px;border-top:1px solid #E0E0E0;font-size:12px;color:#737373;text-align:center}
.admin-badge {
  display: inline-block;
  padding: 4px 8px;
  background: #f1f5f9;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #64748b;
  margin-bottom: 16px;
}
</style></head><body>
<div class="container">
<div class="header"><h1>⚡ Chatify</h1></div>
<div class="content">
<div class="admin-badge">Official Communication</div>
<p style="white-space: pre-wrap;">{{CONTENT}}</p>
<p style="margin-top: 32px; border-top: 1px solid #f1f5f9; padding-top: 24px;">
  Best regards,<br>
  <strong>{{ADMIN_NAME}}</strong><br>
  Chatify Administration
</p>
</div>
<div class="footer">
  This is a verified communication from Chatify.<br>
  © Chatify — Private messaging, simplified.
</div>
</div></body></html>
