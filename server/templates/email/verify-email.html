<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;padding:0;font-family:Inter,-apple-system,sans-serif;background:#F5F5F5;color:#0A0A0A}
.container{max-width:560px;margin:40px auto;background:#FFFFFF;border:1px solid #E0E0E0}
.header{padding:32px;border-bottom:1px solid #E0E0E0;text-align:center}
.header h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-0.5px}
.content{padding:32px}.content p{font-size:14px;line-height:1.6;margin:0 0 16px}
.btn{display:inline-block;padding:12px 32px;background:#0066FF;color:#FFFFFF;text-decoration:none;font-size:14px;font-weight:500}
.code{font-family:'JetBrains Mono',monospace;font-size:32px;letter-spacing:4px;text-align:center;padding:24px;background:#F5F5F5;border:1px solid #E0E0E0;margin:24px 0}
.footer{padding:24px 32px;border-top:1px solid #E0E0E0;font-size:12px;color:#737373;text-align:center}
</style></head><body>
<div class="container">
<div class="header"><h1>⚡ Chatify</h1></div>
<div class="content">
<p>Hi <strong>{{USERNAME}}</strong>,</p>
<p>Please verify your email address by clicking the button below:</p>
<p style="text-align:center;margin:32px 0"><a href="{{VERIFY_URL}}" class="btn">Verify Email</a></p>
<p>Or use this verification code:</p>
<div class="code">{{CODE}}</div>
<p style="color:#737373;font-size:12px">This link expires in 24 hours. If you didn't create an account, ignore this email.</p>
</div>
<div class="footer">© Chatify — Private messaging, simplified.</div>
</div></body></html>
